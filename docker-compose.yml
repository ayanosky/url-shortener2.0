name: url-shortener

services:
  db:
    image: postgres:18
    container_name: pg-shortener
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    volumes:
      - pg_shortener_data:/var/lib/postgresql
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 5s
      timeout: 3s
      retries: 5
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://shortener:shortener@db:5432/shortener?sslmode=disable
    depends_on:
      db:
        condition: service_healthy


volumes:
  pg_shortener_data:
